$kind: http-request
url: "{{gateway_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  X-Device-ID: device-admin-001
body:
  type: text
  content: '{"username":"admin01","password":"Admin@Demo2024"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('admin_token', pm.response.json().data.access_token);
    language: text/javascript
order: 5000
